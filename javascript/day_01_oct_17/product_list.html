<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        h1 {
            color: red;
        }
    </style>
</head>

<body>
    <h1 class="text-center">Product List</h1>
    <button onclick="fetchProducts()" class="btn btn-primary">fetch Products</button>
    <input type="search" placeholder="Search Product..." class="form-control col-sm-6 offset-3">

    <div class="container">
        <div class="row" id="product-container">

        </div>
    </div>
    <script>
        async function fetchProducts() {
            let response = await fetch('https://fakestoreapi.com/products');
            let productArr = await response.json();
            console.log(productArr);
            // Iterate Product Array And display 1 card for each product Object
            const container = document.getElementById('product-container');
            container.innerHTML = '';
            productArr.forEach(product => {
                // Create a column wrap for Bootstrap grid responsiveness
                const col = document.createElement('div');
                col.className = 'col-sm-3';

                // Generate the Bootstrap card markup HTML
                col.innerHTML = `
                <div class="card " >
                    <img src="${product.image}" class="card-img-top" alt="..." height=250>
                    <div class="card-body text-center">
                        <h5 class="card-title">${product.category}</h5>
                        <p class="card-text text-truncate">${product.title}</p>
                        <p class="card-text text-truncate">${product.description}</p>
                        <p class="card-text">${product.price}</p>
                        <p class="card-text">${product.rating.rate}</p>
                        <a href="#" class="btn btn-primary">Buy Now</a>
                    </div>
                    </div>
            `;
                container.appendChild(col);
            });
        }
    </script>
</body>
</html>
