<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Let's Learn document object methods</h1>
    <h2 id="heading2">We are discussing document object</h2>

    <script>
        document.write('Hello, Good Morning!!!');

        document.getElementById('heading2').style.color = 'red';

        document.querySelector('h1').style.color = 'purple';;
    </script>
</body>

</html>
