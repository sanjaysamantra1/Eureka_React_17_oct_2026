<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>HTML has 2 types of elements: 1. inline element 2. Block Level</h1>

    <!-- inline elements -->
    <span>Hellloooo</span>
    <b>World</b>
    <i>This is</i>
    <u>React training</u>

    <!-- Block Level -->
    <div>This is a div</div>
    <div>This is another div</div>
    <p>This is a paragraph</p>
    <p>This is another paragraph</p>
</body>
</html>
