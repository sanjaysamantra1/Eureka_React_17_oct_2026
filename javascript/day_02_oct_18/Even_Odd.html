<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Lets Learn Internal Javascript</h1>

    <script>
        let num = 4;

        if (num % 2 == 0) {
            alert(`${num} is Even`)
        } else {
            alert(`${num} is Odd`)
        }
    </script>
</body>
